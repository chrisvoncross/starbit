<!-- Z-Score Probability Table -->
<div id="zscore-table">
    <table>
        <tr>
            <td class="header-cell">Z-Score:</td>
            <td class="zscore-cell" data-zscore="-3">-3</td>
            <td class="zscore-cell" data-zscore="-2">-2</td>
            <td class="zscore-cell" data-zscore="-1">-1</td>
            <td class="zscore-cell" data-zscore="0">0</td>
            <td class="zscore-cell" data-zscore="1">1</td>
            <td class="zscore-cell" data-zscore="2">2</td>
            <td class="zscore-cell" data-zscore="3">3</td>
        </tr>
        <tr>
            <td class="header-cell">Probability:</td>
            <td class="prob-cell red">0.0013</td>
            <td class="prob-cell yellow">0.0228</td>
            <td class="prob-cell green">0.1600</td>
            <td class="prob-cell green">0.5000</td>
            <td class="prob-cell green">0.8500</td>
            <td class="prob-cell yellow">0.9800</td>
            <td class="prob-cell red">0.9998</td>
        </tr>
    </table>
</div>
