<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sechs Zeiten</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; color: #d1d4dc; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: grid;
            grid-template-rows: auto 1fr;
        }
        header {
            padding: 8px 12px 4px;
            font-size: 13px;
            color: #cfd6e0;
        }
        header .sub { color: #6b7787; font-size: 12px; margin-top: 2px; }
        #grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            min-height: 0;
        }
        .pane {
            display: grid;
            grid-template-rows: auto 1fr;
            min-width: 0;
            min-height: 0;
            border: 1px solid #1c2430;
        }
        .head {
            padding: 4px 8px;
            font-size: 12px;
            color: #e6ebf2;
            background: #0c1017;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .head .src { color: #6b7787; }
        .chart { min-height: 0; }
    </style>
</head>
<body>
    <header>
        <div id="title">Sechs Zeiten</div>
        <div class="sub" id="sub">lade</div>
    </header>
    <div id="grid"></div>
    <script src="/vendor/lightweight-charts.standalone.production.js"></script>
    <script type="module" src="/gegenueber.js?v=leiter1"></script>
</body>
</html>
