[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starbit"
version = "0.1.0"
description = "Orion reads sealed hours and scores the handoff candle."
requires-python = ">=3.11"
dependencies = []

# One install for the reader and the handoff model.
# The import name is lance. The PyPI name is pylance. Do not install the package named lance.
# Listing a remote hour uses boto3. Credentials stay in the environment.
# The CUDA wheel already on the image. A PyPI torch install replaces it.
[project.optional-dependencies]
orion = [
    "numpy>=1.26",
    "pyarrow>=18,<20",
    "pylance>=0.20",
    "boto3>=1.35",
    "torch>=2.4",
]
# Chart server. The import name is lance; the PyPI name is pylance.
# Stay on the 14 series already on the image. Do not install the package named lance.
# Torch stays the CUDA wheel from the orion extra. This list does not install it.
# Nova, the market world model. Install beside the orion extra. Door and Ingress still need that extra.
# The block is official mamba-ssm 2.3.2.post1. PyTorch is 2.9.1 on CUDA 13.0.
# That pair is the newest one with an official Mamba wheel and a current RunPod image.
# The pod is the Hub template "Runpod PyTorch 2.9 CUDA 13.0", one machine.
# The title says 2.9. The image installs torch==2.9.1 from the CUDA 13 index.
# The image name contains cu1300 and torch291 and does not end in -cluster.
# "Runpod Pytorch 2.9.0 for clusters" (a9dk3g7cny) is the same pair for several machines. Not this pod.
# A plain PyPI `torch` install replaces the CUDA wheel already on that image. Do not do that.
nova = [
    "numpy>=1.26",
    "torch==2.9.1",
    "mamba-ssm==2.3.2.post1",
]
horizon = [
    "fastapi",
    "uvicorn[standard]",
    "numpy>=1.26",
    "pyarrow>=18,<20",
    "pylance>=14,<15",
    "boto3>=1.35",
    "python-dotenv",
    "xxhash",
    "loguru",
    "aiohttp",
    "numba",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orion*"]

# `bars` is the candle file. It has no feature_vec.
# Nova opens `features`: the same hour, plus feature_vec of width 204.
# Credentials stay in the environment and are not written here.
[tool.orion.data]
bars = "s3://ghostbyte/warm/sec15/p={hour}/dataset.lance"
features = "s3://ghostbyte/features/warm/sec15/p={hour}/dataset.lance"
