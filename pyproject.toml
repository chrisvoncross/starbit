[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starbit"
version = "0.1.0"
description = "Orion reads sealed hours. Cast forecasts the next candle range."
requires-python = ">=3.11"
dependencies = []

# Ingress. The import name is lance. The PyPI name is pylance. Do not install the package named lance.
# Listing a remote hour takes an S3 client. This package does not build one. boto3 is that client.
# Credentials stay in the environment.
[project.optional-dependencies]
orion = [
    "numpy>=1.26",
    "pyarrow>=18,<20",
    "pylance>=0.20",
    "boto3>=1.35",
]
# The range forecast. MultiQuantile is CPU-only. Numpy comes from the orion extra.
cast = [
    "catboost>=1.2.7",
]
# Same label as cast, XGBoost's own quantile booster. Numpy comes from the orion extra.
xgboost = [
    "xgboost>=3",
]
horizon = [
    "fastapi",
    "uvicorn[standard]",
    "numpy>=1.26",
    "pyarrow>=18,<20",
    "pylance>=14,<15",
    "boto3>=1.35",
    "python-dotenv",
    "xxhash",
    "loguru",
    "aiohttp",
    "numba",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orion*"]

# The sealed hour Ingress reads. It carries feature_vec. Credentials stay in the environment.
[tool.orion.data]
features = "s3://ghostbyte/features/warm/sec15/p={hour}/dataset.lance"
